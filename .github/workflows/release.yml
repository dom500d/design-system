name: Release

on:
  push:
    branches: [main]

# Releases run one at a time, so two quick merges cannot claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The version commit below is pushed by this bot and must not release again.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Choose version
        id: version
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          current=$(node -p "require('./package.json').version")
          # An unreleased version in package.json ships as it is. Otherwise bump
          # the patch number, or use #minor or #major in the merge message.
          if git rev-parse --verify --quiet "refs/tags/v$current" > /dev/null; then
            case "$MESSAGE" in
              *'#major'*) bump=major ;;
              *'#minor'*) bump=minor ;;
              *) bump=patch ;;
            esac
            npm version "$bump" --no-git-tag-version
          fi
          echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: npm test

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json dist docs
          git diff --cached --quiet || git commit -m "Release v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release create "v$VERSION" --verify-tag --generate-notes
